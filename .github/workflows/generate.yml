name: Run Certificate Generator

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Certificate Script
        run: python main.py

      - name: Upload Generated Certificates
        uses: actions/upload-artifact@v4
        with:
          name: certificates-output
          path: certificates/
